services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    build: ./capstone-api
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: change-me
      PORT: 4000
    depends_on:
      - mongo

  client:
    build: ./capstone-client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo-data:
