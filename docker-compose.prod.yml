services:
  mongo:
    image: mongo:7
    container_name: pct-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build: ./capstone-api
    container_name: pct-api
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build: ./capstone-client
    container_name: pct-client
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./capstone-client/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
